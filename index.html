<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M. Hassaan Saleem – Al-Amin Enterprises</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#666;--card:#f6f4f3;--line:#e2dcd9;--red:#f0401f;--deep:#b3201a;--sw:.16;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0b0b;--fg:#f4f4f4;--muted:#aaa;--card:#1c1c1c;--line:#3a3a3a;--sw:.35}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:Inter,Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.swoosh{position:fixed;inset:0;pointer-events:none;opacity:var(--sw)}
.swoosh svg{width:100%;height:100%}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:12px 16px;max-width:480px;margin:0 auto}
.logo{text-align:center;line-height:0}
.logo img{height:clamp(96px,18dvh,150px);width:auto;max-width:60vw;object-fit:contain}
.who{text-align:center}
.av{width:clamp(52px,9dvh,72px);aspect-ratio:1;border-radius:16px;border:2px solid var(--red);display:grid;place-items:center;margin:0 auto 8px;font:700 clamp(18px,3vh,24px) Georgia,serif;color:var(--red);background:var(--card)}
.who h1{font:700 clamp(19px,3.2dvh,24px) "Playfair Display",Georgia,serif}
.who p{color:var(--muted);font-size:14px;margin:2px 0 6px}
.who a{display:block;color:var(--red);text-decoration:none;font-size:14px;font-weight:600;padding:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.6dvh,14px) 8px;width:100%}
.grid>*{background:none;border:0;color:var(--fg);font:inherit;font-size:12px;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ic{width:clamp(46px,7.2dvh,58px);aspect-ratio:1;border:1.5px solid var(--line);border-radius:14px;display:grid;place-items:center;background:var(--card);transition:transform .15s,border-color .15s}
.grid>*:active .ic,.bar>*:active{transform:scale(.94)}
.grid>*:hover .ic{border-color:var(--red)}
svg.i{width:26px;height:26px;fill:none;stroke:var(--red);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.bar>*{min-height:48px;border:0;border-radius:12px;background:var(--card);color:var(--fg);font:600 12px/1.25 inherit;padding:8px;cursor:pointer;border:1px solid var(--line);transition:transform .15s}
.bar>.pri{background:linear-gradient(135deg,var(--red),var(--deep));color:#fff;border:0}
.tg{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:17px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.sh{width:100%;max-width:480px;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s ease;max-height:80dvh;overflow-y:auto;border-top:3px solid var(--red)}
@keyframes up{from{transform:translateY(100%)}}
.sh h2{font:700 19px "Playfair Display",Georgia,serif;margin-bottom:10px;display:flex;justify-content:space-between}
.sh h2 button{background:none;border:0;color:var(--fg);font-size:24px;line-height:1;cursor:pointer;min-width:44px;min-height:32px}
.sh p{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:10px}
.sh a.b{display:block;text-align:center;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--red),var(--deep));border-radius:12px;padding:13px;font-weight:600;margin-top:8px}
.sh a.b.o{background:var(--card);color:var(--fg);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="swoosh" aria-hidden="true"><svg viewBox="0 0 400 800" preserveAspectRatio="none"><path d="M400 0C330 90 300 190 330 300C355 390 400 430 400 430V0Z" fill="#f0401f"/><path d="M0 800C70 730 110 660 90 590C75 540 30 520 0 520V800Z" fill="#b3201a"/></svg></div>
<button class="tg" id="tg" aria-label="Toggle light or dark theme">◐</button>
<main>
  <div class="logo"><img src="logo.png" alt="Al-Amin Enterprises Logo"></div>
  <div class="who">
    <div class="av">MHS</div>
    <h1>M. Hassaan Saleem</h1>
    <p>COO</p>
    <a href="tel:+923004480888">+92 300 4480 888</a>
    <a href="mailto:hassaan@alamin1.com">hassaan@alamin1.com</a>
  </div>
  <nav class="grid" id="grid" aria-label="Actions"></nav>
  <div class="bar">
    <button class="pri" id="save">Save to Phonebook</button>
    <button id="share">Share Contact</button>
    <button id="more">Explore More</button>
  </div>
</main>
<div class="ov" id="ov"><div class="sh" id="sh" role="dialog" aria-modal="true"></div></div>
<script>
(function(){
var P={
profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
whatsapp:'<path d="M3 21l1.6-4.6A9 9 0 1 1 8 19.6z"/><path d="M9 9c0 3 3 6 6 6l1-2-2-1-1 1c-1-.5-2-1.5-2.5-2.5l1-1-1-2z"/>',
email:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
call:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
location:'<path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
website:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
social:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'};
var ico=function(k){return '<span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+P[k]+'</svg></span>'};
var MAP='https://www.google.com/maps/search/?api=1&query=M-Tower+Johar+Town+Lahore';
var items=[['profile','Profile','#profile'],['whatsapp','WhatsApp','https://wa.me/923004480888'],['email','Email','mailto:hassaan@alamin1.com'],['call','Call','#call'],
['location','Location','#location'],['website','Website','https://www.alaminenterprises.com'],['social','Social Links','#social'],['info','Info','#info']];
var g=document.getElementById('grid');
items.forEach(function(it){
  var h=it[2],sheet=h.charAt(0)==='#',el=document.createElement(sheet?'button':'a');
  el.innerHTML=ico(it[0])+it[1];
  if(sheet){el.onclick=function(){open(h.slice(1))}}else{el.href=h;if(h.indexOf('http')===0){el.target='_blank';el.rel='noopener'}}
  g.appendChild(el);
});
var S={
profile:['Profile','<p>M. Hassaan Saleem, COO at Al-Amin Enterprises, Lahore.</p><a class="b" href="mailto:hassaan@alamin1.com">Send an email</a>'],
info:['Info','<p>Al-Amin Enterprises<br>Johar Town, Lahore, Pakistan</p><a class="b" href="https://www.alaminenterprises.com" target="_blank" rel="noopener">Visit our website</a>'],
location:['Location','<p>6th Floor, M-Tower, 336-G3,<br>Johar Town, Lahore, Pakistan</p><a class="b" href="'+MAP+'" target="_blank" rel="noopener">Open in Maps</a>'],
social:['Social Links','<p>Social media links will appear here.</p><a class="b o" href="https://www.alaminenterprises.com" target="_blank" rel="noopener">Visit our website</a>'],
call:['Call','<a class="b" href="tel:+923004480888">Mobile · +92 300 4480 888</a><a class="b o" href="tel:+924235306014">Office · +92 42 3530 6014</a><a class="b o" href="https://wa.me/923004480888" target="_blank" rel="noopener">WhatsApp</a>']
};
var ov=document.getElementById('ov'),sh=document.getElementById('sh');
function open(k){sh.innerHTML='<h2>'+S[k][0]+'<button aria-label="Close">×</button></h2>'+S[k][1];sh.querySelector('h2 button').onclick=close;ov.classList.add('on')}
function close(){ov.classList.remove('on')}
ov.onclick=function(e){if(e.target===ov)close()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
document.getElementById('more').onclick=function(){open('info')};
var vcf=['BEGIN:VCARD','VERSION:3.0','N:Saleem;M. Hassaan;;;','FN:M. Hassaan Saleem','ORG:Al-Amin Enterprises','TITLE:COO','TEL;TYPE=CELL:+923004480888','TEL;TYPE=WORK:+924235306014','EMAIL:hassaan@alamin1.com','URL:https://www.alaminenterprises.com','ADR;TYPE=WORK:;;6th Floor, M-Tower, 336-G3, Johar Town;Lahore;;;Pakistan','END:VCARD'].join('\r\n');
document.getElementById('save').onclick=function(){
  try{
    var f=new File([vcf],'Hassaan-Saleem.vcf',{type:'text/vcard'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}
    var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='Hassaan-Saleem.vcf';document.body.appendChild(a);a.click();a.remove();
  }catch(e){open('call')}
};
document.getElementById('share').onclick=function(){
  var u=location.href;
  if(navigator.share){navigator.share({title:'M. Hassaan Saleem – Al-Amin Enterprises',url:u}).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){alert('Link copied')}).catch(function(){})}
};
var r=document.documentElement;
document.getElementById('tg').onclick=function(){
  r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';
  try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}
};
try{var t=localStorage.getItem('theme');if(t)r.dataset.theme=t}catch(e){}
})();
</script>
</body>
</html>
